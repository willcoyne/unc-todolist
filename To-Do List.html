<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do List</title>
<style>
  :root {
    --face: #c0c0c0;
    --hi: #ffffff;
    --dark: #404040;
    --field: #ffffff;
    --text: #000000;
    --title-a: #000080;
    --title-b: #1084d0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --face: #4a4a4a;
      --hi: #7a7a7a;
      --dark: #0a0a0a;
      --field: #1c1c1c;
      --text: #f0f0f0;
      --title-a: #000060;
      --title-b: #0a5a98;
    }
  }
  :root[data-theme="dark"] {
    --face: #4a4a4a; --hi: #7a7a7a; --dark: #0a0a0a;
    --field: #1c1c1c; --text: #f0f0f0; --title-a: #000060; --title-b: #0a5a98;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    height: 100vh;
    background: var(--face);
    color: var(--text);
    font: 14px Tahoma, "MS Sans Serif", Verdana, sans-serif;
    display: flex;
  }

  .raised { border: 2px solid; border-color: var(--hi) var(--dark) var(--dark) var(--hi); }
  .sunken { border: 2px solid; border-color: var(--dark) var(--hi) var(--hi) var(--dark); }

  .window { background: var(--face); flex: 1; padding: 3px; display: flex; flex-direction: column; }

  .title {
    background: linear-gradient(90deg, var(--title-a), var(--title-b));
    color: #fff;
    font-weight: bold;
    padding: 3px 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }
  .title span:last-child { letter-spacing: 6px; }

  .body { flex: 1; min-height: 0; padding: 8px; display: flex; flex-direction: column; gap: 8px; }

  .row { display: flex; gap: 6px; align-items: center; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    background: var(--field);
    color: var(--text);
    font: inherit;
    padding: 3px 4px;
    border-radius: 0;
  }
  button {
    background: var(--face);
    color: var(--text);
    font: inherit;
    padding: 3px 12px;
    border-radius: 0;
    cursor: pointer;
  }
  button:active { border-color: var(--dark) var(--hi) var(--hi) var(--dark); }

  ul {
    list-style: none;
    margin: 0;
    padding: 2px;
    background: var(--field);
    flex: 1;
    overflow-y: auto;
  }
  li { padding: 2px 4px; }
  li label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  li.done { text-decoration: line-through; opacity: 0.6; }
  .desc { margin-left: 22px; font-size: 12px; }
  input.date { flex: none; width: 4.5em; text-align: center; }

  .status { padding: 2px 6px; font-size: 12px; }
</style>
</head>
<body>
  <div class="window raised">
    <div class="title"><span>To-Do List</span><span><span data-cmd="min">_</span><span data-cmd="max">□</span><span data-cmd="close">×</span></span></div>
    <div class="body">
      <div class="row">
        <input type="text" id="task" class="sunken" placeholder="New task" autofocus>
        <button id="add" class="raised">Add</button>
      </div>
      <div class="row">
        <input type="text" id="desc" class="sunken" placeholder="Description (optional)">
        <input type="text" id="date" class="sunken date" placeholder="MM/DD" maxlength="5" inputmode="numeric">
      </div>
      <ul id="list" class="sunken"></ul>
      <div class="row">
        <button id="clear" class="raised">Clear done</button>
      </div>
      <div id="status" class="status sunken"></div>
    </div>
  </div>

<script>
  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
  const list = document.getElementById("list");
  const input = document.getElementById("task");
  const descInput = document.getElementById("desc");
  const dateInput = document.getElementById("date");

  dateInput.oninput = e => {
    let v = dateInput.value.replace(/[^\d/]/g, "");
    if (/^\d\//.test(v)) v = "0" + v;
    const digits = v.replace(/\D/g, "").slice(0, 4);
    const deleting = e.inputType && e.inputType.startsWith("delete");
    dateInput.value = digits.length > 2 || (digits.length === 2 && !deleting)
      ? digits.slice(0, 2) + "/" + digits.slice(2)
      : digits;
  };

  function render() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
    list.innerHTML = "";
    tasks.forEach(t => {
      const li = document.createElement("li");
      if (t.done) li.className = "done";
      const label = document.createElement("label");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = t.done;
      box.onchange = () => { t.done = box.checked; render(); };
      const text = document.createElement("span");
      text.textContent = (t.date ? "[" + t.date + "] " : "") + t.text;
      label.append(box, text);
      li.append(label);
      if (t.desc) {
        const d = document.createElement("div");
        d.className = "desc";
        d.textContent = t.desc;
        li.append(d);
      }
      list.append(li);
    });
    const done = tasks.filter(t => t.done).length;
    document.getElementById("status").textContent = tasks.length + " tasks, " + done + " done";
  }

  function add() {
    const text = input.value.trim();
    if (!text) return;
    const [m, d] = dateInput.value.split("/").map(Number);
    const date = m >= 1 && m <= 12 && d >= 1 && d <= 31 ? m + "/" + d : "";
    tasks.push({ text, desc: descInput.value.trim(), date, done: false });
    input.value = "";
    descInput.value = "";
    dateInput.value = "";
    render();
  }

  // Title bar: buttons minimize/maximize/close, anywhere else drags the window
  document.querySelector(".title").onmousedown = e => {
    if (e.button === 0) window.chrome?.webview?.postMessage(e.target.dataset.cmd || "drag");
  };

  document.getElementById("add").onclick = add;
  input.onkeydown = descInput.onkeydown = dateInput.onkeydown = e => { if (e.key === "Enter") add(); };
  document.getElementById("clear").onclick = () => { tasks = tasks.filter(t => !t.done); render(); };
  render();
</script>
</body>
</html>
